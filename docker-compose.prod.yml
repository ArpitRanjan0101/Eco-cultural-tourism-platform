# Production stack (DECISIONS J2). Run with an env file that is never committed:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Differences from development: prod image (no dev deps/tests, read-only root FS), runtime DB role
# with data-only privileges, TLS on the public edge, private BFF listener on a Docker network only,
# no Mailpit/SeaweedFS (managed SMTP and S3), resource limits, log rotation, dropped capabilities.
name: ${COMPOSE_PROJECT_NAME:-jharkhand-tourism-prod}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=64m,mode=1777"]

x-backend-image: &backend-image
  image: ${IMAGE_REPOSITORY:-jharkhand-tourism-backend}:${IMAGE_TAG:?IMAGE_TAG is required (e.g. the git commit)}
  build:
    context: ./backend
    target: prod
    args:
      GIT_COMMIT: ${IMAGE_TAG}

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 4000
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The API and worker connect as the least-privilege runtime role (see the migrate service).
  DATABASE_URL: postgres://${DATABASE_APP_USER:?DATABASE_APP_USER is required}:${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
  INTERNAL_SERVICE_TOKEN_PREVIOUS: ${INTERNAL_SERVICE_TOKEN_PREVIOUS:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:-jharkhand-tourism-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-jharkhand-tourism-bff}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}
  STORAGE_REGION: ${STORAGE_REGION:?STORAGE_REGION is required}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
  STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:?STORAGE_PUBLIC_BUCKET is required}
  STORAGE_PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:?STORAGE_PRIVATE_BUCKET is required}
  STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:?STORAGE_PUBLIC_BASE_URL is required}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-razorpay}
  PAYMENT_KEY_ID: ${PAYMENT_KEY_ID:?PAYMENT_KEY_ID is required}
  PAYMENT_KEY_SECRET: ${PAYMENT_KEY_SECRET:?PAYMENT_KEY_SECRET is required}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}
  PAYMENT_API_BASE_URL: ${PAYMENT_API_BASE_URL:-https://api.razorpay.com/v1}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
  APP_WEB_URL: ${APP_WEB_URL:?APP_WEB_URL is required}

services:
  api:
    <<: [*backend-image, *hardening]
    init: true
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *logging
    restart: unless-stopped
    networks: [internal, egress, app]

  worker:
    <<: [*backend-image, *hardening]
    init: true
    command: ["node", "src/jobs/worker.js"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, egress]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    logging: *logging
    restart: unless-stopped

  # One-off, as the schema owner: applies migrations, then re-syncs the runtime role's grants.
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
  #   ... run --rm migrate node src/database/cli.js seed      (reference data / bootstrap admin)
  migrate:
    <<: [*backend-image, *hardening]
    profiles: [ops]
    command: ["node", "src/database/cli.js", "migrate"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB}
      DATABASE_APP_USER: ${DATABASE_APP_USER}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, egress]
    logging: *logging

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256m
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # TCP probe: the first-boot init server listens on the Unix socket only, so a socket probe passes too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    networks: [internal]
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    # BullMQ requires noeviction; maxmemory stays below the container limit so Redis refuses
    # writes (visible errors) instead of being OOM-killed.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    networks: [internal]
    logging: *logging
    restart: unless-stopped

  nginx:
    image: nginx:1.27.3-alpine
    volumes:
      - ./infrastructure/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # fullchain.pem + privkey.pem (e.g. from certbot); never committed.
      - ${TLS_CERT_DIR:-./infrastructure/nginx/certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-./infrastructure/nginx/acme}:/var/www/acme:ro
    tmpfs: ["/var/cache/nginx:size=64m", "/var/run:size=1m", "/tmp:size=16m"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # The BFF listener (8081) is not published: the Next.js BFF joins the `bff` network.
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    networks: [edge, bff, app]
    logging: *logging
    restart: unless-stopped

  # On demand: `--profile ops run --rm backup [backup.sh | restore.sh <file> <new_db> | verify-restore.sh <a> <b>]`.
  # Schedule backup.sh daily from the host (cron/systemd timer) and copy ${BACKUP_HOST_DIR} off-site.
  backup:
    image: postgis/postgis:16-3.5
    profiles: [ops]
    entrypoint: ["/bin/sh", "-c", "[ $$# -gt 0 ] || set -- backup.sh; script=$$1; shift; exec /bin/sh \"/scripts/$$script\" \"$$@\"", "backup"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infrastructure/backup:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    logging: *logging

volumes:
  postgres_data:
  redis_data:

networks:
  # Databases and Redis: no route to the outside world.
  internal:
    internal: true
  # Outbound HTTPS/SMTP for the API and worker (S3, Razorpay, email).
  egress:
  # nginx -> api only.
  app:
    internal: true
  # Public ingress to nginx.
  edge:
  # Shared with the Next.js BFF's compose project (`external: true` there) to reach nginx:8081.
  bff:
    name: ${BFF_NETWORK:-jharkhand-tourism-bff}
