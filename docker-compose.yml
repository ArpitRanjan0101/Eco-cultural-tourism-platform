name: jharkhand-tourism

x-backend-build: &backend-build
  context: ./backend
  target: ${BUILD_TARGET:-dev}
  args:
    GIT_COMMIT: ${GIT_COMMIT:-unknown}

# Only the variables each container needs; .env is not passed wholesale.
x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: ${PORT:-4000}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  TEST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
  INTERNAL_SERVICE_TOKEN_PREVIOUS: ${INTERNAL_SERVICE_TOKEN_PREVIOUS:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:-jharkhand-tourism-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-jharkhand-tourism-bff}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  api:
    build: *backend-build
    image: jharkhand-tourism-backend:${IMAGE_TAG:-dev}
    init: true
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: *backend-build
    image: jharkhand-tourism-backend:${IMAGE_TAG:-dev}
    init: true
    command: ["node", "src/jobs/worker.js"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, edge]
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Development only: creates <POSTGRES_DB>_test on first initialisation.
      - ./infrastructure/postgres/init/01-create-test-db.sh:/docker-entrypoint-initdb.d/01-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  nginx:
    image: nginx:1.27.3-alpine
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PUBLIC_PORT:-8080}:80"
      - "127.0.0.1:${NGINX_INTERNAL_PORT:-8081}:8081"
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    internal: true
  edge:
