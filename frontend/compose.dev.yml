# Frontend development stack. A separate compose project from the backend (root docker-compose.yml), joined to
# the backend's existing `edge` network so the BFF reaches nginx's private listener at http://nginx:8081.
# Start the backend stack first (`docker compose up -d` in the repository root).
#
#   docker compose -f frontend/compose.dev.yml up -d --build web
#   docker compose -f frontend/compose.dev.yml run --rm web npm run lint
#   docker compose -f frontend/compose.dev.yml run --rm web npm test
#   docker compose -f frontend/compose.dev.yml --profile e2e up -d --build web-e2e
#   docker compose -f frontend/compose.dev.yml --profile e2e run --rm --build e2e
name: jharkhand-tourism-web

services:
  web:
    build:
      context: .
      target: dev
    image: jharkhand-tourism-web:dev
    init: true
    # Server-only configuration, validated at startup (src/config/env.server.js). Required.
    env_file: .env
    environment:
      NODE_ENV: development
      # Bind mounts from a Windows host deliver no file-change events. Turbopack cannot poll, so the dev server
      # runs on webpack with polling (DECISIONS W26).
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ./:/app
      # Keep Linux node_modules and the build cache inside the container (anonymous volumes).
      # After dependency changes: rebuild and recreate with `up -d --build -V web`.
      - /app/node_modules
      - /app/.next
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Production build used as the browser-test target (on demand only): what users get, and stable under load.
  web-e2e:
    build:
      context: .
      target: prod
    image: jharkhand-tourism-web:prod
    profiles: [e2e]
    env_file: .env
    environment:
      # Production rules apply (W19); this throwaway target has no cookies yet, so a placeholder https origin is fine.
      APP_ORIGIN: https://web-e2e.test
      SESSION_COOKIE_SECURE: "true"
      ENABLE_DESIGN_SYSTEM: "true"
    networks: [backend]

  # Browser tests (Playwright) against web-e2e (on demand only).
  e2e:
    build:
      context: .
      target: e2e
    image: jharkhand-tourism-web:e2e
    profiles: [e2e]
    # Chromium crashes ("Page crashed") with Docker's default 64 MB /dev/shm under parallel workers.
    shm_size: 1gb
    environment:
      E2E_BASE_URL: http://web-e2e:3000
    volumes:
      - ./playwright-report:/e2e/playwright-report
      - ./test-results:/e2e/test-results
    depends_on:
      web-e2e: { condition: service_healthy }
    networks: [backend]

networks:
  backend:
    external: true
    name: jharkhand-tourism_edge
