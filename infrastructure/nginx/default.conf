# Re-resolve the api container through Docker DNS so a recreated container
# (new IP) does not leave nginx pointing at a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
    zone api_upstream 64k;
    server api:4000 resolve;
    keepalive 32;
}

# Keep a caller-supplied request id, otherwise use nginx's own.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=public_edge:10m rate=20r/s;

server_tokens off;

# ---------------------------------------------------------------------------
# Public edge listener. Only payment-provider webhooks and liveness are
# reachable; every other path (including /api/v1/admin) is refused here.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    client_max_body_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never forward BFF-only headers arriving from the public internet.
    proxy_set_header X-Internal-Service-Token "";
    proxy_set_header X-Client-Ip "";

    location = /health/live {
        proxy_pass http://api_upstream;
    }

    location ^~ /api/v1/webhooks/payments/ {
        limit_req zone=public_edge burst=40 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://api_upstream;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Private listener for the Next.js BFF on the Docker network. Published only
# on 127.0.0.1 in development; not published in production.
# ---------------------------------------------------------------------------
server {
    listen 8081;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api_upstream;
    }

    location /health/ {
        proxy_pass http://api_upstream;
    }

    location / {
        return 404;
    }
}
