# Production nginx (DECISIONS J2). Public edge on 80/443 (TLS), private BFF listener on 8081
# reachable only from the `bff` Docker network. Certificates: /etc/nginx/certs/{fullchain,privkey}.pem.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
    zone api_upstream 64k;
    server api:4000 resolve;
    keepalive 32;
}

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=public_edge:10m rate=20r/s;

server_tokens off;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# ---------------------------------------------------------------------------
# HTTP: ACME HTTP-01 challenges and a redirect to HTTPS; nothing else.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS public edge. Only liveness and payment-provider webhooks are reachable.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The edge owns these headers; drop the API's copies so each appears once.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never forward BFF-only headers arriving from the public internet.
    proxy_set_header X-Internal-Service-Token "";
    proxy_set_header X-Client-Ip "";

    location = /health/live {
        proxy_pass http://api_upstream;
    }

    location ^~ /api/v1/webhooks/payments/ {
        limit_req zone=public_edge burst=40 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://api_upstream;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Private listener for the Next.js BFF (Docker network `bff` only; not published).
# ---------------------------------------------------------------------------
server {
    listen 8081;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api_upstream;
    }

    location /health/ {
        proxy_pass http://api_upstream;
    }

    location / {
        return 404;
    }
}
